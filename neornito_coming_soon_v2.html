
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--font:'Satoshi',sans-serif}

body{
  min-height:100vh;
  background:#080808;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  cursor:none;
  font-family:var(--font);
}

#grain{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0.55}

.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;will-change:transform}
.orb-1{width:65vw;height:65vw;background:radial-gradient(circle,#1a3a2a 0%,transparent 70%);top:-15vw;right:-15vw;animation:drift1 18s ease-in-out infinite alternate}
.orb-2{width:55vw;height:55vw;background:radial-gradient(circle,#0d1f30 0%,transparent 70%);bottom:-10vw;left:-10vw;animation:drift2 22s ease-in-out infinite alternate}
.orb-3{width:40vw;height:40vw;background:radial-gradient(circle,#2a1a10 0%,transparent 70%);top:30%;left:25%;animation:drift3 14s ease-in-out infinite alternate}

@keyframes drift1{from{transform:translate(0,0) scale(1)} to{transform:translate(-4vw,6vw) scale(1.08)}}
@keyframes drift2{from{transform:translate(0,0) scale(1)} to{transform:translate(5vw,-4vw) scale(1.05)}}
@keyframes drift3{from{transform:translate(0,0)} to{transform:translate(3vw,5vw)}}

#cursor{
  width:6px;height:6px;
  background:#f5f5f0;
  border-radius:50%;
  position:fixed;
  pointer-events:none;
  z-index:9999;
  mix-blend-mode:difference;
}

.stage{
  position:relative;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:40px 24px;
}

.logo-lockup{
  display:flex;flex-direction:column;
  align-items:center;
  gap:22px;
  margin-bottom:64px;
  opacity:0;
  animation:riseIn 1.1s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
}
.logo-mark{width:72px;height:72px;object-fit:contain}
.brand-name{
  font-family:var(--font);
  font-weight:700;
  font-size:13px;
  letter-spacing:0.3em;
  text-transform:uppercase;
  color:#f5f5f0;
}

.headline{
  font-family:var(--font);
  font-weight:700;
  font-size:clamp(48px,8vw,112px);
  line-height:0.9;
  letter-spacing:-0.04em;
  color:#f5f5f0;
  opacity:0;
  animation:riseIn 1.1s cubic-bezier(0.16,1,0.3,1) 0.45s forwards;
}
.headline span{
  display:block;
  color:transparent;
  -webkit-text-stroke:1px rgba(245,245,240,0.25);
}

.sub{
  font-family:var(--font);
  font-weight:400;
  font-size:13px;
  color:rgba(245,245,240,0.35);
  letter-spacing:0.08em;
  margin-top:40px;
  opacity:0;
  animation:riseIn 1s cubic-bezier(0.16,1,0.3,1) 0.7s forwards;
}

.bottom-strip{
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  border-top:1px solid rgba(255,255,255,0.06);
  opacity:0;
  animation:fadeIn 1s 1s forwards;
}
.strip-label{
  font-family:var(--font);
  font-weight:400;
  font-size:10px;
  color:rgba(245,245,240,0.25);
  letter-spacing:0.14em;
  text-transform:uppercase;
}
.strip-dot{
  width:6px;height:6px;
  background:#2a6644;
  border-radius:50%;
  display:inline-block;
  margin-right:8px;
  animation:pulse 2.5s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(42,102,68,0.4)}
  50%{opacity:0.7;box-shadow:0 0 0 6px rgba(42,102,68,0)}
}
@keyframes riseIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{to{opacity:1}}
</style>

<canvas id="grain"></canvas>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div id="cursor"></div>

<main class="stage">
  <div class="logo-lockup">
    <img class="logo-mark" src="/mnt/user-data/uploads/logo.png" alt="Neornito">
    <span class="brand-name">Neornito</span>
  </div>
  <h1 class="headline">
    Coming<br><span>soon.</span>
  </h1>
  <p class="sub">Wildlife research equipment — launching 2025</p>
</main>

<div class="bottom-strip">
  <span class="strip-label"><span class="strip-dot"></span>In development</span>
  <span class="strip-label">neornito.com</span>
  <span class="strip-label">Warsaw · PL</span>
</div>

<script>
const cur = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX - 3 + 'px';
  cur.style.top = e.clientY - 3 + 'px';
});

(function(){
  const canvas = document.getElementById('grain');
  const ctx = canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
  resize();
  window.addEventListener('resize',resize);
  function draw(){
    const w=canvas.width,h=canvas.height;
    const img=ctx.createImageData(w,h);
    const d=img.data;
    for(let i=0;i<d.length;i+=4){
      const v=Math.random()*255|0;
      d[i]=d[i+1]=d[i+2]=v;
      d[i+3]=18;
    }
    ctx.putImageData(img,0,0);
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
